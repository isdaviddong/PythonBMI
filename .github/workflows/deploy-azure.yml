name: Deploy BMI to Azure

on:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - templates/**
      - static/**
      - tests/**
      - .github/workflows/deploy-azure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-bmi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment target
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ] || [ -z "$AZURE_RESOURCE_GROUP" ]; then
            echo "::error::Set AZURE_WEBAPP_NAME and AZURE_RESOURCE_GROUP repository variables to the Linux Web App target."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Linux Web App and enable Python build
        run: |
          platform="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query reserved --output tsv)"
          if [ "$platform" != "true" ]; then
            echo "::error::The target must be a Linux Azure Web App running Python 3.12."
            exit 1
          fi
          runtime="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query linuxFxVersion --output tsv)"
          if [ "$runtime" != "PYTHON|3.12" ]; then
            echo "::error::Set the Linux Web App runtime to PYTHON|3.12 before deploying."
            exit 1
          fi
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            --output none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          startup-command: gunicorn --bind=0.0.0.0:8000 app:app
